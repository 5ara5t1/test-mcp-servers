[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "5ara5t1", email = "sarasti-5@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
mcp-server = "mcp_server.mcp_server:main"


[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
